<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/logo.png">
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'</script>
<title>VapeTime P&amp;L Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f7f4;--card:#fff;--tx:#14211a;--mut:#6b7d73;--bd:#e3ebe6;--pr:#1f9d55;--pr2:#6cc491;--soft:#e6f5ec;--softer:#f1faf4;--ok:#1ea56b;--bad:#e5484d;--or:#f0642f;--vi:#8b5cf6;--bl:#3b82f6;--yl:#e5a00d;--pk:#d946a8;--tl:#14b8a6;--sh:0 1px 2px rgba(20,60,40,.04),0 8px 24px rgba(20,60,40,.06)}
[data-theme=dark]{--bg:#0b120e;--card:#111b15;--tx:#e8f2ec;--mut:#93a89b;--bd:#213027;--pr:#35c46f;--pr2:#1c7a43;--soft:#16281d;--softer:#0f1f16;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select{font:inherit;color:inherit}[hidden]{display:none!important}.mut,small{color:var(--mut)}.grow{flex:1}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#050706;z-index:100}
.slides,.slides i,.veil{position:absolute;inset:0}
.slides i{display:block;background-size:cover;background-position:center;filter:blur(9px) brightness(.6) saturate(1.2);transform:scale(1.1);opacity:0;animation:sl 16s infinite ease-in-out}
.slides i:nth-child(2){animation-delay:8s}
@keyframes sl{0%{opacity:0;transform:scale(1.08)}8%,50%{opacity:1}58%,100%{opacity:0;transform:scale(1.16)}}
.veil{background:radial-gradient(circle at 50% 50%,rgba(10,40,20,.4),rgba(4,16,10,.75))}
.lg-card{position:relative;background:rgba(17,27,21,.78);backdrop-filter:blur(14px);padding:34px 32px;border-radius:20px;border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.6);width:min(390px,90vw);display:flex;flex-direction:column;gap:14px;animation:ip .6s ease-out;color:#e8f2ec}
@keyframes ip{from{opacity:0;transform:translateY(20px)}}
.lg-logo{width:180px;align-self:center;margin-bottom:4px}
.lg-card h2{text-align:center;font-size:22px;font-weight:700}
.lg-card p.mut{text-align:center;color:#a0b3a7}
.lg-card label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#a0b3a7;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.lg-card input{padding:12px 14px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(0,0,0,.3);outline:0;font-size:14px;color:#e8f2ec;transition:.2s}
.lg-card input:focus{border-color:var(--pr);background:rgba(0,0,0,.5)}
.err{color:#ff6b6b;font-size:12px;min-height:16px;text-align:center}
.btn-pr{background:var(--pr);color:#fff;padding:12px;border-radius:10px;font-weight:700;font-size:14px;transition:.2s;border:0;cursor:pointer}
.btn-pr:hover{filter:brightness(1.1)}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint{font-size:12px;color:#8ba695;text-align:center;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}

/* ---------- app ---------- */
#app{display:flex;min-height:100vh}
#side{width:240px;background:var(--card);border-right:1px solid var(--bd);padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .3s;overflow:hidden;flex-shrink:0;z-index:10}
.collapsed #side{width:72px}
.collapsed .lbl{opacity:0;width:0;overflow:hidden;position:absolute}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:22px;white-space:nowrap}
.mk{width:46px;height:34px;overflow:hidden;flex-shrink:0;display:flex;align-items:center}
.mk img{height:34px;width:auto;display:block}
.bn{font-size:13px;line-height:1.2;letter-spacing:.02em}
#collapse{margin-left:auto;border:1px solid var(--bd);background:var(--card);width:26px;height:26px;border-radius:50%;cursor:pointer;transition:transform .3s;color:var(--mut);font-size:14px;display:grid;place-items:center}
.collapsed #collapse{transform:rotate(180deg)}
nav{display:flex;flex-direction:column;gap:2px}
nav small{display:block;margin:14px 10px 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mut);font-weight:500;white-space:nowrap;transition:.2s;font-size:13.5px}
nav a i{font-style:normal;width:20px;text-align:center;font-size:15px}
nav a:hover{background:var(--soft);color:var(--tx)}
nav a.on{background:var(--soft);color:var(--pr);font-weight:600}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--softer);white-space:nowrap}
.side-foot .av{width:32px;height:32px;border-radius:9px;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.side-foot .nm{font-size:13px;font-weight:600}
.side-foot .nm small{display:block;font-size:10px}
#logout{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--mut);font-size:16px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
#logout:hover{background:var(--card);color:var(--bad)}

main{flex:1;min-width:0;padding:0 24px 32px}
.top{display:flex;align-items:center;gap:14px;padding:24px 0 22px;min-height:96px;position:sticky;top:0;background:var(--bg);z-index:9;flex-wrap:wrap}
.top .ttl{display:flex;flex-direction:column;line-height:1.1}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.top .sub{font-size:13px;color:var(--mut);margin-top:4px}
.upd{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.upd i{width:8px;height:8px;border-radius:50%;background:var(--pr);box-shadow:0 0 0 0 var(--pr);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,85,.5)}70%{box-shadow:0 0 0 8px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
.topr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* dropdowns */
.ddwrap{position:relative}
.ddbtn{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--bd);background:var(--card);border-radius:10px;color:var(--tx);min-width:140px;transition:.2s;font-size:13px;cursor:pointer}
.ddbtn:hover{border-color:var(--pr);color:var(--pr)}
.ddbtn .k{font-size:10px;text-transform:uppercase;color:var(--mut);letter-spacing:.08em;font-weight:600}
.ddbtn .v{font-weight:600;color:var(--tx);margin-left:auto}
.ddbtn .ca{color:var(--mut);font-size:10px}
.ddpanel{position:absolute;top:calc(100% + 6px);left:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:8px;min-width:260px;z-index:50;animation:ip .18s}
.ddpanel input.search{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);outline:0;margin-bottom:6px;font-size:13px}
.ddpanel input.search:focus{border-color:var(--pr)}
.ddlist{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ddopt{display:flex;align-items:center;gap:10px;padding:9px 10px;background:none;border:0;border-radius:8px;color:var(--tx);text-align:left;cursor:pointer;transition:.12s;font-size:13px;width:100%}
.ddopt:hover,.ddopt.hi{background:var(--soft)}
.ddopt .chk{width:16px;height:16px;flex:none;border-radius:5px;border:1.5px solid var(--bd);display:grid;place-items:center;font-size:10px;color:transparent;transition:.15s}
.ddopt[aria-selected=true] .chk{background:var(--pr);border-color:var(--pr);color:#fff}
.ddopt .sid{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
.ddfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px 2px;margin-top:4px;border-top:1px solid var(--bd);font-size:11px;color:var(--mut)}
.ddfoot button{padding:5px 12px;border-radius:8px;background:var(--pr);color:#fff;font-weight:600;font-size:12px;border:0;cursor:pointer}

/* icon buttons */
.ibtn{width:38px;height:38px;border:1px solid var(--bd);background:var(--card);border-radius:10px;color:var(--mut);display:grid;place-items:center;cursor:pointer;transition:.2s;font-size:16px}
.ibtn:hover{border-color:var(--pr);color:var(--pr)}
.ibtn.spin{animation:sp .6s linear}
@keyframes sp{to{transform:rotate(360deg)}}

/* grid */
.grid{display:grid;gap:16px;margin-bottom:0}
#viewroot{display:grid;gap:16px;align-content:start}#viewroot>*{min-width:0}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--sh)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.qc{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;transition:.2s;color:var(--tx)}
.qc:hover{border-color:var(--pr);color:var(--pr)}.qc.on{background:var(--pr);border-color:var(--pr);color:#fff}
.g2{grid-template-columns:2fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1200px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g2,.g2e{grid-template-columns:1fr}}
@media(max-width:720px){.g6,.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}}

/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh);min-width:0;animation:ip .35s ease-out}
.card h3{font-size:15px;font-weight:700;letter-spacing:.01em}
.card .sub{font-size:12px;color:var(--mut);margin-top:2px;margin-bottom:14px}
.card.kpi .t{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px;font-weight:600}
.card.kpi .ic{width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--pr);display:grid;place-items:center;font-size:14px}
.card.kpi .v{font-size:26px;font-weight:800;margin:10px 0 6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.card.kpi .f{font-size:12px;color:var(--mut)}
.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}

/* chart canvas */
.ch{position:relative;height:280px}
.ch.s{height:220px}
.ch.m{height:320px}
.ch.l{height:400px}
.ch.xl{height:480px}
.ch canvas{max-width:100%}

/* heatmap */
.heat{display:grid;gap:3px;font-size:11px;font-variant-numeric:tabular-nums}
.heat .hdr{display:contents;font-weight:600;color:var(--mut)}
.heat .hc{padding:6px 8px;text-align:center;border-radius:6px;color:var(--tx);min-width:60px;font-weight:600;transition:.2s;cursor:default}
.heat .hc:hover{transform:scale(1.05);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.heat .rhdr{text-align:right;padding:6px 10px 6px 2px;color:var(--mut);font-weight:600}

/* tables */
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px}
.tw.tall{max-height:620px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{position:sticky;top:0;background:var(--softer);text-align:left;padding:11px 12px;font-weight:700;cursor:pointer;user-select:none;z-index:3;border-bottom:1px solid var(--bd);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
th:first-child{position:sticky;left:0;z-index:4;min-width:200px}
td{padding:10px 12px;border-top:1px solid var(--bd)}
td:first-child{position:sticky;left:0;background:var(--card);z-index:2;font-weight:600;min-width:200px}
tbody tr{transition:background .15s}
tbody tr:hover td{background:var(--softer)}
tbody tr:hover td:first-child{background:var(--softer)}
tbody tr.sec td{background:var(--soft)!important;color:var(--pr);font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
tbody tr.sec td:first-child{background:var(--soft)!important;color:var(--pr)}
tbody tr.sub td{font-weight:700;background:var(--softer)!important}
tbody tr.sub td:first-child{background:var(--softer)!important}
tfoot td{font-weight:700;background:var(--softer);position:sticky;bottom:0}
.swatch{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:middle}

/* badges */
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.b-ok{background:#1ea56b22;color:var(--ok)}.b-bad{background:#e5484d22;color:var(--bad)}
.b-mid{background:#f0642f22;color:var(--or)}.b-na{background:var(--soft);color:var(--mut)}

/* tab strip */
.tabstrip{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
.tab{padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:500;color:var(--tx);background:var(--card);border:1px solid var(--bd);cursor:pointer;transition:.18s;white-space:nowrap}
.tab:hover{border-color:var(--pr);color:var(--pr)}
.tab[aria-selected=true]{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
.tab .amt{font-size:11px;opacity:.85;font-weight:500;font-variant-numeric:tabular-nums}

/* section hero */
.hd{display:flex;justify-content:space-between;align-items:center;margin:6px 0 0;flex-wrap:wrap;gap:12px}
.hd h2{font-size:17px;font-weight:700}
.hd .sub{font-size:12px;color:var(--mut);margin-top:2px}

/* store cards */
.stcard{display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.stcard:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(20,60,40,.1);border-color:var(--pr)}
.stcard .nm{font-weight:700;font-size:15px}
.stcard .sid{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.08em}
.stcard .row{display:flex;justify-content:space-between;font-size:12px}
.stcard .row b{font-size:14px;font-variant-numeric:tabular-nums}
.stcard .accent{position:absolute;top:0;left:0;right:0;height:3px;background:var(--pr)}

/* search */
.srch{position:relative;display:flex;align-items:center;gap:8px}
.srch input{padding:9px 12px 9px 34px;border:1px solid var(--bd);border-radius:10px;background:var(--card);outline:0;font-size:13px;color:var(--tx);min-width:220px}
.srch input:focus{border-color:var(--pr)}
.srch .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px;pointer-events:none}

/* small */
.mini{font-size:11px;color:var(--mut)}
.chip{padding:4px 10px;border-radius:14px;background:var(--soft);color:var(--pr);font-weight:600;font-size:11px}

/* drilldown panel */
.drill{background:var(--softer);border:1px dashed var(--bd);border-radius:12px;padding:14px;margin-top:12px;animation:ip .35s}
.drill .close{float:right;color:var(--mut);background:none;border:0;cursor:pointer;font-size:16px}
.drill h4{font-size:13px;font-weight:700;margin-bottom:10px}

.view{animation:fade .35s}@keyframes fade{from{opacity:0}}

/* modal */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:200;animation:fade .2s;padding:20px;backdrop-filter:blur(2px)}
.mbox{background:var(--card);border-radius:18px;padding:26px;width:min(1120px,96vw);max-height:92vh;overflow:auto;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:ip .3s ease-out}
.mbox h2{font-size:22px;font-weight:800}.mbox .msub{color:var(--mut);font-size:13px;margin:2px 0 18px}
.mx{position:absolute;right:16px;top:14px;font-size:20px;color:var(--mut);width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.mx:hover{background:var(--soft);color:var(--tx)}
.mbody{display:grid;gap:16px}
.mbox .card{box-shadow:none;background:var(--card)}
.share{display:inline-block;height:6px;border-radius:4px;background:var(--pr);vertical-align:middle;margin-left:8px}
/* progress */
.tg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.spk path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s ease-out .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pcard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;animation:ip .4s ease-out backwards;display:flex;flex-direction:column;gap:8px}
.pcard:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,60,40,.12);border-color:var(--pr)}
.pcard .bar3{position:absolute;left:0;top:0;bottom:0;width:4px}
.pcard .pn{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pcard .pv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pcard .pr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .pm{font-size:11.5px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{padding:7px 14px;font-size:12px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--pr);color:#fff}
.ptbl td,.ptbl th{padding:10px 12px}
.pcell{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:210px}
.pcell .pvv{font-weight:700;font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<section id="login">
  <div class="slides"><i id="bg1"></i><i id="bg2"></i></div>
  <div class="veil"></div>
  <form class="lg-card" id="loginform" autocomplete="on">
    <img id="loginlogo" class="lg-logo" alt="Vape Time">
    <h2>P&amp;L Leadership Dashboard</h2>
    <p class="mut">Sign in to open the leadership dashboard.</p>
    <label>Username<input id="u" autocomplete="username" placeholder="admin"></label>
    <label>Password<input id="p" type="password" autocomplete="current-password" placeholder="Enter password"></label>
    <div id="err" class="err"></div>
    <button type="submit" class="btn-pr">Sign in</button>
    <p class="hint">5 stores · January – July 2026</p>
  </form>
</section>

<div id="app" hidden>
  <aside id="side">
    <div class="brand">
      <span class="mk"><img id="raillogo" alt="Vape Time"></span>
      <span class="bn lbl">P&amp;L<br>Dashboard</span>
      <button id="collapse" title="Collapse menu">‹</button>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span class="av">A</span>
      <div class="nm lbl">Admin<small>Leadership</small></div>
      <button id="logout" title="Sign out" class="lbl">⏻</button>
    </div>
  </aside>
  <main>
    <header class="top">
      <div class="ttl"><h1 id="ptitle">Overview</h1><div class="sub" id="psub">Group performance at a glance</div></div>
      <div class="topr">
        <div class="srch"><span class="ico">⌕</span><input id="gq" placeholder="Search anywhere…"></div>
        <span class="upd" id="upd"></span>
        <button class="ibtn" id="reload" title="Refresh">↻</button>
        <button class="ibtn" id="theme" title="Toggle theme">☾</button>
      </div>
    </header>
    <div class="fbar" id="fbar"><div class="ddwrap" id="dd-store"></div><div class="ddwrap" id="dd-period"></div><div class="chips" id="qchips"></div></div>
    <div id="viewroot" class="view"></div>

// data accessors
function lineMonths(line, ids){
  const row = LINES.find(l=>l.l===line || l.k===line);
  if(!row) return MONTHS.map(_=>0);
  return MONTHS.map((_,mi)=>sum(ids.map(id=>+((row.v[id]||[])[mi]||0))));
}
function secRows(sec){
  const meta=SECBY[sec], rows=LINES.filter(l=>l.s===sec);
  if(meta && meta.vr) return rows.filter(l=>meta.vr.indexOf(l.l.toUpperCase())>=0);
  const t=rows.filter(l=>l.k==='total');
  return t.length?t:rows.filter(l=>l.k==='data');
}
function secMonths(sec, ids){
  if(sec==='NET INCOME'||sec==='GROSS PROFIT & OTHER INCOME'||sec==='ADJUSTED OPERATING EXPENSES'){
    const t=LINES.filter(l=>l.s===sec&&l.k==='total'); if(t.length) return MONTHS.map((_,mi)=>sum(t.map(l=>sum(ids.map(id=>+((l.v[id]||[])[mi]||0))))));
  }
  const rows=secRows(sec);
  return MONTHS.map((_,mi)=>sum(rows.map(l=>sum(ids.map(id=>+((l.v[id]||[])[mi]||0))))));
}
function secChildren(sec, ids){
  const meta=SECBY[sec];
  const rows=(meta&&meta.vr)?secRows(sec):LINES.filter(l=>l.s===sec&&l.k==='data');
  return rows.map(l=>{
    const m = MONTHS.map((_,mi)=>sum(ids.map(id=>+((l.v[id]||[])[mi]||0))));
    const total = sum(m.slice(state.from,state.to+1));
    return {k:l.l, label:l.l, months:m, total};
  }).sort((a,b)=>Math.abs(b.total)-Math.abs(a.total));
}
function rowsMonths(a){return a.slice(state.from, state.to+1);}
function R(a){return a.slice(state.from, state.to+1);}

const SECBY = {}; SECTIONS.forEach(s=>SECBY[s.k]=s);
const activeSections = ()=>SECTIONS.filter(s=>s.k!=='FUEL INCOME');

// unallocated: section-level posted amount minus sum of its lines (per period, all stores)
function unallocatedForView(){
  const ids = sids();
  let diff = 0;
  SECTIONS.forEach(s=>{
    if(s.k==='MERCHANDISE GROSS PROFIT' || s.k==='GROSS PROFIT & OTHER INCOME' || s.k==='ADJUSTED OPERATING EXPENSES' || s.k==='NET INCOME') return;
    const posted = s.posted ? sum(ids.map(id=>sum(R((s.posted[id]||[]))))) : null;
    if(posted==null) return;
    const kids = sum(R(secMonths(s.k, ids)));
    diff += posted - kids;
  });
  return diff;
}

// ---------- Chart.js setup ----------
Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
Chart.defaults.font.size = 11.5;
let CHARTS = [];
function killCharts(){CHARTS.forEach(c=>{try{c.destroy()}catch(e){}});CHARTS=[];}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

function chart(canvas, cfg){
  if(!canvas) return;
  const mut = css('--mut'), bd = css('--bd');
  Chart.defaults.color = mut;
  cfg.options = Object.assign({
    responsive:true, maintainAspectRatio:false,
    animation:{duration:1300,easing:'easeOutQuart',delay:(c)=>(c.type==='data'&&c.mode==='default')?c.dataIndex*80+c.datasetIndex*140:0},
    interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{position:'bottom', labels:{usePointStyle:true, boxWidth:8, padding:14, color:css('--tx'), font:{size:12,weight:'500'}}},
      tooltip:{backgroundColor:'rgba(20,33,26,.95)', padding:12, borderRadius:10, titleFont:{size:13,weight:'700'}, bodyFont:{size:12}, boxPadding:6, usePointStyle:true, borderColor:'rgba(255,255,255,.08)', borderWidth:1}
    }
  }, cfg.options||{});
  if(cfg.type!=='doughnut' && cfg.type!=='pie'){
    cfg.options.scales = Object.assign({
      x:{grid:{display:false,drawBorder:false}, ticks:{color:mut,font:{size:11}}},
      y:{grid:{color:bd,drawBorder:false}, ticks:{color:mut,font:{size:11},callback:v=>compact(v)}}
    }, cfg.options.scales||{});
  }
  const c = new Chart(canvas, cfg);
  CHARTS.push(c);
  return c;
}

// count up for KPI values
function countUp(el, target, fmt){
  const t0 = performance.now(), dur = 900;
  const step = (now)=>{
    const p = Math.min(1,(now-t0)/dur);
    const v = target*(1-Math.pow(1-p,3));
    el.textContent = fmt(v);
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

    closeDD();

    const inp=document.createElement('input'); inp.className='search'; inp.placeholder='Search store…';
    const list=document.createElement('div'); list.className='ddlist';

    done.addEventListener('click', e=>{e.stopPropagation(); closeDD();});
    foot.appendChild(done);
    p.appendChild(inp); p.appendChild(list); p.appendChild(foot);
    host.appendChild(p); openDD=p;
    const opts=[{id:'ALL', t:'All stores', sid:'★'}].concat(STORES.map(s=>({id:s.id, t:s.short, sid:s.id})));
    let hi=0;
    function apply(arr){
      state.stores = arr.length>=STORES.length?[]:arr;
      b.innerHTML = lab();
      render({keep:true});
    }
    function pick(id){
      if(id==='ALL'){apply([]);return;}
      if(!state.stores.length){apply([id]);return;}
      const cur=state.stores.slice(), i=cur.indexOf(id);
      if(i>=0) cur.splice(i,1); else cur.push(id);
      apply(cur);
    }
    function draw(){
      const q=inp.value.trim().toLowerCase();
      const f=opts.filter(o=>!q || o.t.toLowerCase().indexOf(q)>=0 || o.sid.indexOf(q)>=0);
      list.innerHTML='';
      if(!f.length){list.innerHTML='<div style="padding:16px;color:var(--mut);font-size:12px">No store matches.</div>';return;}
      hi=Math.min(hi,f.length-1);
      f.forEach((o,i)=>{
        const on = o.id==='ALL' ? !state.stores.length : (!state.stores.length || state.stores.indexOf(o.id)>=0);
        const bt=document.createElement('button'); bt.type='button'; bt.className='ddopt'+(i===hi?' hi':'');
        bt.setAttribute('aria-selected', on);
        bt.innerHTML='<span class="chk">✓</span><span class="sid">'+esc(o.sid)+'</span><span>'+esc(o.t)+'</span>';
        bt.addEventListener('click', e=>{e.stopPropagation(); pick(o.id);});
        list.appendChild(bt);
      });
    }
    inp.addEventListener('input', ()=>{hi=0; draw();});
    inp.addEventListener('keydown', e=>{
      const n = list.querySelectorAll('.ddopt').length;
      if(e.key==='ArrowDown'){hi=Math.min(n-1,hi+1); draw(); e.preventDefault();}
      else if(e.key==='ArrowUp'){hi=Math.max(0,hi-1); draw(); e.preventDefault();}
      else if(e.key==='Enter'){const el=list.querySelectorAll('.ddopt')[hi]; if(el)el.click(); e.preventDefault();}
    });
    p.addEventListener('click', e=>e.stopPropagation());
    draw();
    setTimeout(()=>inp.focus(),10);
  });
  host.appendChild(b);
}

    const rows=kids.map(k=>'<tr><td>'+esc(k.label)+'</td>'+R(k.months).map(v=>'<td class="n">'+(Math.abs(v)<.005?'—':money(v))+'</td>').join('')+'<td class="n"><b>'+money(k.total)+'</b></td><td class="n">'+(tot?(k.total/tot*100).toFixed(1):'0.0')+'%<span class="share" style="width:'+Math.round(Math.abs(k.total)/mx*50)+'px"></span></td></tr>');
    rows.push('<tr class="sub"><td>Total</td>'+mTot.map(v=>'<td class="n">'+money(v)+'</td>').join('')+'<td class="n"><b>'+money(tot)+'</b></td><td class="n">100%</td></tr>');

  });

      {type:'bar',label:'Sales',data:sales,backgroundColor:PR,borderRadius:8,order:3,barPercentage:.62,categoryPercentage:.75},
      {type:'line',label:'Gross profit',data:gp,borderColor:'#0b5a30',backgroundColor:'#0b5a3022',tension:.35,borderWidth:3,pointRadius:5,pointBackgroundColor:'#0b5a30',fill:false,order:1},
      {type:'line',label:'Net income',data:net,borderColor:OR,borderDash:[6,4],tension:.35,borderWidth:2.5,pointRadius:4,pointBackgroundColor:OR,fill:false,order:2}
    ]},
    options:{plugins:{tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+money(ctx.raw)},title:(items)=>RLONG()[items[0].dataIndex]}}}
  }));

  // Profit bridge (horizontal waterfall, clickable)
  const c2 = card('Profit bridge', 'Merchandise sales turning into net income. Click any bar to see its full breakup.');
  root.appendChild(c2);
  const h2 = chartHost('xl'); c2.body.appendChild(h2.wrap);
  const expSections = ['LABOUR EXPENSE','OTHER LABOUR EXPENSE','MM EXPENSE','AUDITOR & SUPPORT COSTS','RENT EXPENSE','REPAIR AND MAINTENANCE','UTILITIES','INSURANCE, SUPPLIES & FEES','OTHER OPERATING EXPENSES'];
  const expLabels = ['Labour','Other labour','Market manager','Audit & support','Rent','Repair & maintenance','Utilities','Insurance & fees','Other operating'];
  const STEPS = [
    {label:'Merchandise sales',secs:['MERCHANDISE SALES'],val:sum(sales),col:PR},
    {label:'Cost of sales',secs:['MERCHANDISE COST OF SALES'],val:-sum(cos),col:OR},
    {label:'Inventory adjustment',secs:['INVENTORY ADJUSTMENT'],val:sum(inv),col:sum(inv)>=0?PR:OR},
    {label:'Other income',secs:['OTHER INCOME'],val:sum(oi),col:sum(oi)>=0?PR:OR},
    {label:'Lottery & vending',secs:['NET VENDING INCOME'],val:sum(vend),col:sum(vend)>=0?PR:OR},
  ];
  expSections.forEach((k,i)=>{const v=sum(R(secMonths(k,ids))); STEPS.push({label:expLabels[i],secs:[k],val:-v,col:OR});});
  let run=0; STEPS.forEach(s=>run+=s.val);
  const resid = sum(net)-run;
  if(Math.abs(resid)>1) STEPS.push({label:'Unallocated',secs:[],val:resid,col:VI,unalloc:true});
  STEPS.push({label:'Net income',secs:[],val:sum(net),col:sum(net)>=0?PR:RD,isNet:true});
  let base=0;
  const floats = STEPS.map((s,i)=>{
    if(i===0){base=s.val;return [0,s.val];}
    if(s.isNet) return [Math.min(0,s.val),Math.max(0,s.val)];
    const st=base,en=base+s.val; base=en; return [Math.min(st,en),Math.max(st,en)];
  });
  const lblPlugin={id:'bl',afterDatasetsDraw(ch){const ctx=ch.ctx,m=ch.getDatasetMeta(0);ctx.save();ctx.font='600 11.5px Inter';ctx.fillStyle=css('--tx');ctx.textBaseline='middle';

    options:{indexAxis:'y',layout:{padding:{right:70}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const s=STEPS[ctx.dataIndex];return (s.val>0&&ctx.dataIndex>0&&!s.isNet?'+':'')+money(s.val)+'  ·  click for breakup';}}}},

  }));

  const g2 = document.createElement('div'); g2.className='grid g2e'; root.appendChild(g2);
  const dc = card('Operating expense mix', 'Where the operating spend goes.');

  const expItems = expSections.map((k,i)=>({label:expLabels[i], value:Math.abs(sum(R(secMonths(k,ids))))})).filter(x=>x.value>1).sort((a,b)=>b.value-a.value);
  const h3 = chartHost('l'); dc.body.appendChild(h3.wrap);
  requestAnimationFrame(()=>chart(h3.canvas,{
    type:'doughnut',
    data:{labels:expItems.map(x=>x.label), datasets:[{data:expItems.map(x=>x.value), backgroundColor:PAL, borderWidth:2, borderColor:css('--card')}]},
    options:{cutout:'65%', plugins:{legend:{position:'right', labels:{usePointStyle:true,boxWidth:10,padding:12,color:css('--tx'),font:{size:12}}}, tooltip:{callbacks:{label:ctx=>ctx.label+': '+money(ctx.raw)+' ('+(ctx.raw/sum(expItems.map(x=>x.value))*100).toFixed(1)+'%)'}}}}
  }));

  const nc = card('Net income by store', 'Click a bar to drill into that store’s full breakup.');
  g2.appendChild(nc);
  const niItems = SEL().map(s=>({label:s.short, id:s.id, value:sum(R(secMonths('NET INCOME',[s.id])))})).sort((a,b)=>b.value-a.value);
  const h4 = chartHost('l'); nc.body.appendChild(h4.wrap);
  requestAnimationFrame(()=>{
    const c = chart(h4.canvas,{
      type:'bar',
      data:{labels:niItems.map(x=>x.label), datasets:[{label:'Net income', data:niItems.map(x=>x.value), backgroundColor:niItems.map(x=>x.value>=0?PR:RD), borderRadius:8, barPercentage:.72}]},
      options:{indexAxis:'y', onHover:(e,els)=>{e.native.target.style.cursor=els.length?'pointer':'default';}, plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>money(ctx.raw)}}}, scales:{x:{grid:{color:css('--bd')}, ticks:{callback:v=>compact(v)}}, y:{grid:{display:false}}}, onClick:(evt,els)=>{
        if(!els.length) return;
        const idx = els[0].index;

      }}
    });
  });

      type:'bar',

      type:'doughnut',

      + '</tbody></table>';
    c4.body.appendChild(tbl);
  }
}

function buildHeatmap(host, rows, cols, matrix){
  host.innerHTML='';
  const flat = matrix.flat(); const mx = Math.max(...flat.map(Math.abs))||1;
  const grid = document.createElement('div'); grid.className='heat';
  grid.style.gridTemplateColumns = '160px repeat('+cols.length+',1fr)';
  // header
  grid.appendChild(elH('rhdr','',true));
  cols.forEach(c=>{const h=elH('rhdr',c);h.style.textAlign='center';h.style.padding='6px 0';grid.appendChild(h);});
  rows.forEach((r,ri)=>{
    grid.appendChild(elH('rhdr',r));
    cols.forEach((c,ci)=>{
      const v = matrix[ri][ci];
      const a = Math.abs(v)/mx;
      const col = v>=0 ? `rgba(31,157,85,${Math.max(.08,a*.65)})` : `rgba(229,72,77,${Math.max(.08,a*.65)})`;
      const d = document.createElement('div'); d.className='hc'; d.style.background=col; d.textContent=compact(v); d.title=r+' · '+c+' : '+money2(v);
      grid.appendChild(d);
    });
  });
  host.appendChild(grid);
  function elH(cls,txt,empty){const d=document.createElement('div'); d.className='rhdr'; d.textContent=empty?'':txt; return d;}
}

// ---------- Progress ----------
const LOWER_BETTER = new Set(['MERCHANDISE COST OF SALES','LABOUR EXPENSE','OTHER LABOUR EXPENSE','MM EXPENSE','AUDITOR & SUPPORT COSTS','RENT EXPENSE','REPAIR AND MAINTENANCE','UTILITIES','INSURANCE, SUPPLIES & FEES','OTHER OPERATING EXPENSES','ADJUSTED OPERATING EXPENSES']);
const GOOD='var(--ok)', BAD='var(--bad)';
function pidx(){ // indices: latest, previous, period start
  const cur=state.to, prev=cur>0?cur-1:null;
  let start=state.from; if(start>=cur) start=prev;
  return {cur,prev,start};
}
function trendWin(){const e=state.to;const n=Math.max(nMon(),6);const b=Math.max(0,e-n+1);return [b,e];}
function chg(arr,i,j,lower){
  if(i==null||j==null||j<0) return null;
  const cur=arr[i], base=arr[j], d=cur-base;
  const p = base? d/Math.abs(base) : (cur?1:0);
  return {cur,base,d,p,up:d>=0,flat:Math.abs(p)<0.0005,good: lower? d<=0 : d>=0};
}
function pcol(c){ if(!c||c.flat) return 'var(--mut)'; return state.pmode==='quality' ? (c.good?GOOD:BAD) : (c.up?GOOD:BAD); }
function tag(c){
  if(!c) return '<span class="tg" style="color:var(--mut);background:var(--soft)">n/a</span>';
  const col=pcol(c);
  const a=c.flat?'●':(c.up?'▲':'▼');
  return '<span class="tg" style="color:'+col+';background:color-mix(in srgb,'+col+' 14%,transparent)">'+a+' '+(Math.abs(c.p)*100).toFixed(1)+'%</span>';
}
function spark(vals,color,w,h){
  w=w||96;h=h||30;
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1,n=Math.max(vals.length-1,1);
  const pts=vals.map((v,i)=>[2+i*(w-4)/n,h-3-(v-mn)/rg*(h-6)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const l=pts[pts.length-1];
  return '<svg class="spk" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="'+d+'" pathLength="1" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="3" fill="'+color+'"/></svg>';
}
function wser(arr){const [b,e]=trendWin();return arr.slice(b,e+1);}

function winOf(arr){ // values across the selected period (>=2 points)
  if(nMon()>=2) return R(arr);
  const c=state.to; return c>0?[arr[c-1],arr[c]]:[arr[c]];
}
function trendOf(arr,lower){
  const y=winOf(arr),n=y.length; if(n<2) return null;
  const ym=sum(y)/n,xm=(n-1)/2;let num=0,den=0;
  y.forEach((v,i)=>{num+=(i-xm)*(v-ym);den+=(i-xm)*(i-xm);});
  const slope=den?num/den:0,change=slope*(n-1),rel=change/(Math.abs(ym)||1);
  const dir=Math.abs(rel)<0.03?'flat':(rel>0?'up':'down');
  const good=dir==='flat'?null:(lower?dir==='down':dir==='up');
  return {dir,good,rel,first:y[0],last:y[n-1],vals:y};
}
function tcol(t){return !t||t.dir==='flat'?'var(--mut)':(t.good?GOOD:BAD);}
function trendTag(t){
  if(!t) return '<span class="tg" style="color:var(--mut);background:var(--soft)">n/a</span>';
  const col=tcol(t),txt=t.dir==='up'?'▲ Rising':(t.dir==='down'?'▼ Falling':'● Stable');
  return '<span class="tg" style="color:'+col+';background:color-mix(in srgb,'+col+' 14%,transparent)">'+txt+'</span>';
}

    options:{plugins:{tooltip:{callbacks:{label:x=>x.dataset.label+': '+money(x.raw)}}}}}));
  const rows=SEL().map(st=>{const a=secMonths(key,[st.id]),t=trendOf(a,lo);
    return '<tr><td><span class="swatch" style="background:'+sCol(st.id)+'"></span>'+esc(st.short)+'</td>'+R(a).map(v=>'<td class="n">'+money(v)+'</td>').join('')+'<td class="n"><b>'+money(sum(R(a)))+'</b></td><td>'+trendTag(t)+'</td><td class="n">'+(t?spark(t.vals,tcol(t),90,26):'')+'</td></tr>';});
  if(SEL().length>1) rows.push('<tr class="sub"><td>All selected</td>'+R(all).map(v=>'<td class="n">'+money(v)+'</td>').join('')+'<td class="n"><b>'+money(sum(R(all)))+'</b></td><td>'+trendTag(tAll)+'</td><td class="n">'+(tAll?spark(tAll.vals,tcol(tAll),90,26):'')+'</td></tr>');

  // all metrics at a glance
  const c2=card('All metrics · month by month','Every metric for '+scopeLabel()+'. Click a row to open it in the store view above.');root.appendChild(c2);
  const mrows=info.map(({x,t})=>{const a=secMonths(x.k,ids);
    return '<tr data-k="'+esc(x.k)+'" style="cursor:pointer"><td>'+esc(x.n)+'</td>'+R(a).map(v=>'<td class="n">'+money(v)+'</td>').join('')+'<td class="n"><b>'+money(sum(R(a)))+'</b></td><td>'+trendTag(t)+'</td><td class="n">'+(t?spark(t.vals,tcol(t),90,26):'')+'</td></tr>';});

function RLONG0(i){const m=MONTHS[i];if(!m)return '–';const [y,mo]=m.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo-1]+" '"+y.slice(2);}
function pCard(name,key,arr,lo,i){
  const P=pidx(), c=chg(arr,P.cur,P.prev,lo), cs=chg(arr,P.cur,P.start,lo), col=c?pcol(c):'var(--mut)';
  const d=document.createElement('div');d.className='pcard';d.style.animationDelay=(i*45)+'ms';
  d.innerHTML='<div class="bar3" style="background:'+col+'"></div><div class="pn">'+esc(name)+'</div><div class="pr"><div class="pv">'+money(arr[P.cur])+'</div>'+spark(wser(arr),col,90,32)+'</div>'+
   '<div class="pr">'+tag(c)+'<span class="pm">vs '+esc(P.prev!=null?RLONG0(P.prev):'–')+'</span></div>'+
   '<div class="pr"><span class="pm">Since '+esc(P.start!=null?RLONG0(P.start):'–')+'</span>'+tag(cs)+'</div>';
  d.addEventListener('click',()=>openProgressModal(name,key,lo));
  return d;
}

  VIEWS.forEach(v=>{
    if(v.group!==lastGroup){const s=document.createElement('small'); s.className='lbl'; s.textContent=v.group; nav.appendChild(s); lastGroup=v.group;}
    const a=document.createElement('a'); a.dataset.v=v.id; a.className=state.view===v.id?'on':'';
    a.innerHTML='<i>'+esc(v.icon)+'</i><span class="lbl">'+esc(v.label)+'</span>';
    a.addEventListener('click',()=>{state.view=v.id; state.openSub=null; render({top:true});});
    nav.appendChild(a);
  });
}

function syncSub(){
  const v = VIEWS.find(x=>x.id===state.view);
  document.getElementById('ptitle').textContent = v.label;
  document.getElementById('psub').textContent = v.sub+' · '+scopeLabel()+' · '+RLONG()[0]+(nMon()>1?' – '+RLONG()[nMon()-1]:'');
}
function stamp(){const d=new Date();let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');const ap=h>=12?'PM':'AM';h=h%12||12;document.getElementById('upd').innerHTML='<i></i>Updated '+String(h).padStart(2,'0')+':'+m+' '+ap;}
function quickChips(){
  const host=document.getElementById('qchips');host.innerHTML='';
  const L=MONTHS.length;
  [['All',0,L-1],['Last 3',Math.max(0,L-3),L-1],['Last 6',Math.max(0,L-6),L-1]].forEach(([t,f,to])=>{
    const b=document.createElement('button');b.type='button';b.className='qc'+(state.from===f&&state.to===to?' on':'');b.textContent=t;
    b.addEventListener('click',()=>{state.from=f;state.to=to;render({keep:true});});host.appendChild(b);});
  const r=document.createElement('button');r.type='button';r.className='qc';r.textContent='Reset';
  r.addEventListener('click',()=>{state.from=0;state.to=L-1;state.stores=[];state.q='';render({keep:true});});host.appendChild(r);
}
function render(o){
  o=o||{};
  closeDD();
  buildNav();
  storeDropdown(document.getElementById('dd-store'));
  periodDropdown(document.getElementById('dd-period'));
  quickChips();stamp();
  renderContent(o);
}
function renderContent(o){
  o=o||{};
  closeModal();killCharts();
  const v = VIEWS.find(x=>x.id===state.view);
  syncSub();
  const root = document.getElementById('viewroot');
  const y = window.scrollY, h = root.offsetHeight;
  if(!o.top) root.style.minHeight = h+'px';
  root.innerHTML='';
  root.classList.remove('view'); void root.offsetWidth; root.classList.add('view');
  if(state.view==='overview') viewOverview(root);
  else if(state.view==='metrics') viewMetrics(root);
  else if(state.view==='stores') viewStores(root);
  else if(state.view==='rankings') viewRankings(root);
  else if(state.view==='progress') viewProgress(root);
  else viewStatement(root);
  if(o.top){root.style.minHeight=''; window.scrollTo(0,0);}
  else{window.scrollTo(0,y); setTimeout(()=>{root.style.minHeight='';},500);}
}

// ---------- Theme toggle, logout, collapse, login ----------
document.getElementById('theme').addEventListener('click',()=>{
  state.theme = state.theme==='dark'?'light':'dark';
  localStorage.setItem('theme',state.theme);
  document.documentElement.setAttribute('data-theme',state.theme);
  document.getElementById('theme').textContent = state.theme==='dark'?'☀':'☾';
  renderContent({keep:true});
});
document.getElementById('reload').addEventListener('click',(e)=>{
  e.currentTarget.classList.add('spin'); setTimeout(()=>e.currentTarget.classList.remove('spin'),600);
  stamp();renderContent({keep:true});
});
document.getElementById('collapse').addEventListener('click',()=>{
  state.collapsed = !state.collapsed;
  document.getElementById('app').classList.toggle('collapsed', state.collapsed);
});
document.getElementById('logout').addEventListener('click',()=>{
  sessionStorage.removeItem('vt-auth');
  document.getElementById('app').hidden=true;
  document.getElementById('login').hidden=false;
});
document.getElementById('gq').addEventListener('input', e=>{
  state.q = e.target.value;
  if(state.view==='statement') renderContent({keep:true});
});

const form = document.getElementById('loginform');
form.addEventListener('submit',(e)=>{
  e.preventDefault();
  const u = document.getElementById('u').value.trim(), p = document.getElementById('p').value;
  if(u==='admin' && p==='admin123'){
    try{sessionStorage.setItem('vt-auth','1');}catch(e){}
    openApp();
  } else {
    const err = document.getElementById('err'); err.textContent='Invalid credentials';
    form.classList.add('shake'); setTimeout(()=>form.classList.remove('shake'),400);
  }
});
function openApp(){
  document.getElementById('login').hidden=true;
  document.getElementById('app').hidden=false;
  render({top:true});
}
window.addEventListener('resize',()=>{clearTimeout(window._rt); window._rt=setTimeout(()=>{if(!document.getElementById('app').hidden) renderContent({keep:true});},300);});
try{if(sessionStorage.getItem('vt-auth')==='1') openApp();}catch(e){}
})();
</script>
</body>
</html>
